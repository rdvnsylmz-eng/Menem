<body class="gallery-page">
    <div class="nav-wrapper"></div>

    <header class="page-hero">
      <div class="page-hero__inner">
        <span class="section__eyebrow">Arşiv</span>
        <h1>Fotoğraf Galerisi</h1>
        <p>Antrenmanlardan ve etkinliklerden kareler.</p>
      </div>
    </header>

    <div class="mgsk-photo-gallery reveal">
        <div class="mgsk-main-image-wrapper">
            <img src="assets/1.jpg" alt="Fotoğraf 1" class="mgsk-main-image active" width="1200" height="750">
            <button class="mgsk-nav-button prev" type="button" aria-label="Önceki fotoğraf"><i class="ri-arrow-left-s-line" aria-hidden="true"></i></button>
            <button class="mgsk-nav-button next" type="button" aria-label="Sonraki fotoğraf"><i class="ri-arrow-right-s-line" aria-hidden="true"></i></button>
        </div>

        <div class="mgsk-thumbnails-container">
            <div class="mgsk-thumbnails">
                <div class="mgsk-thumbnail-item active" data-index="0"><img src="assets/1.jpg" alt="Küçük Resim 1" loading="lazy"></div>
                <div class="mgsk-thumbnail-item" data-index="1"><img src="assets/2.jpg" alt="Küçük Resim 2" loading="lazy"></div>
                <div class="mgsk-thumbnail-item" data-index="2"><img src="assets/3.jpg" alt="Küçük Resim 3" loading="lazy"></div>
                <div class="mgsk-thumbnail-item" data-index="3"><img src="assets/4.jpg" alt="Küçük Resim 4" loading="lazy"></div>
                <div class="mgsk-thumbnail-item" data-index="4"><img src="assets/5.jpg" alt="Küçük Resim 5" loading="lazy"></div>
                <div class="mgsk-thumbnail-item" data-index="5"><img src="assets/6.jpg" alt="Küçük Resim 6" loading="lazy"></div>
                <div class="mgsk-thumbnail-item" data-index="6"><img src="assets/7.jpg" alt="Küçük Resim 7" loading="lazy"></div>
                <div class="mgsk-thumbnail-item" data-index="7"><img src="assets/8.jpg" alt="Küçük Resim 8" loading="lazy"></div>
                <div class="mgsk-thumbnail-item" data-index="8"><img src="assets/9.jpg" alt="Küçük Resim 9" loading="lazy"></div>
                <div class="mgsk-thumbnail-item" data-index="9"><img src="assets/10.jpg" alt="Küçük Resim 10" loading="lazy"></div>
                <div class="mgsk-thumbnail-item" data-index="10"><img src="assets/11.jpg" alt="Küçük Resim 11" loading="lazy"></div>
                <div class="mgsk-thumbnail-item" data-index="11"><img src="assets/12.jpg" alt="Küçük Resim 12" loading="lazy"></div>
                <div class="mgsk-thumbnail-item" data-index="12"><img src="assets/13.jpg" alt="Küçük Resim 13" loading="lazy"></div>
                <div class="mgsk-thumbnail-item" data-index="13"><img src="assets/14.jpg" alt="Küçük Resim 14" loading="lazy"></div>
                <div class="mgsk-thumbnail-item" data-index="14"><img src="assets/15.jpg" alt="Küçük Resim 15" loading="lazy"></div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

<script>
    const mainImage = document.querySelector('.mgsk-main-image');
    const prevButton = document.querySelector('.mgsk-nav-button.prev');
    const nextButton = document.querySelector('.mgsk-nav-button.next');
    const thumbnailItems = document.querySelectorAll('.mgsk-thumbnail-item');

    let currentIndex = 0;
    const totalImages = thumbnailItems.length;

    function updateGallery() {
        const newSrc = thumbnailItems[currentIndex].querySelector('img').src;
        mainImage.classList.remove('active');
        setTimeout(() => {
            mainImage.src = newSrc;
            mainImage.alt = `Fotoğraf ${currentIndex + 1}`;
            mainImage.classList.add('active');
        }, 50);

        thumbnailItems.forEach((item, index) => {
            if (index === currentIndex) {
                item.classList.add('active');
                item.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
            } else {
                item.classList.remove('active');
            }
        });
    }

    function showNextImage() {
        currentIndex = (currentIndex + 1) % totalImages;
        updateGallery();
    }

    function showPrevImage() {
        currentIndex = (currentIndex - 1 + totalImages) % totalImages;
        updateGallery();
    }

    prevButton.addEventListener('click', showPrevImage);
    nextButton.addEventListener('click', showNextImage);

    thumbnailItems.forEach(item => {
        item.addEventListener('click', () => {
            currentIndex = parseInt(item.dataset.index, 10);
            updateGallery();
        });
    });

    document.addEventListener('DOMContentLoaded', updateGallery);
</script>
    <script src="menu.js"></script>
    <script src="footer.js?v=2"></script>
    <script src="scroll-effects.js"></script>
</body>
</html>
