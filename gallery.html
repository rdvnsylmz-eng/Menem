    <div id="footer-placeholder"></div>

<script>
    const mainImage = document.querySelector('.mgsk-main-image');
    const prevButton = document.querySelector('.mgsk-nav-button.prev');
    const nextButton = document.querySelector('.mgsk-nav-button.next');
    const allThumbs = Array.from(document.querySelectorAll('.mgsk-thumbnail-item'));
    const filterButtons = document.querySelectorAll('.gallery-filter-btn');

    let visibleThumbs = allThumbs.slice();
    let currentIndex = 0;

    function updateGallery() {
        if (!visibleThumbs.length) return;
        const active = visibleThumbs[currentIndex];
        const newSrc = active.querySelector('img').src;
        const newAlt = active.querySelector('img').alt || ('Fotoğraf ' + (currentIndex + 1));
        mainImage.classList.remove('active');
        setTimeout(() => {
            mainImage.src = newSrc;
            mainImage.alt = newAlt;
            mainImage.classList.add('active');
        }, 50);

        allThumbs.forEach((item) => item.classList.remove('active'));
        active.classList.add('active');
        try {
          active.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'nearest' });
        } catch (e) {}
    }

    function showNextImage() {
        if (!visibleThumbs.length) return;
        currentIndex = (currentIndex + 1) % visibleThumbs.length;
        updateGallery();
    }

    function showPrevImage() {
        if (!visibleThumbs.length) return;
        currentIndex = (currentIndex - 1 + visibleThumbs.length) % visibleThumbs.length;
        updateGallery();
    }

    function applyFilter(filter) {
        visibleThumbs = allThumbs.filter((item) => {
            const match = filter === 'all' || item.dataset.category === filter;
            item.classList.toggle('is-hidden', !match);
            return match;
        });
        currentIndex = 0;
        updateGallery();
    }

    prevButton.addEventListener('click', showPrevImage);
    nextButton.addEventListener('click', showNextImage);

    allThumbs.forEach((item) => {
        item.addEventListener('click', () => {
            const idx = visibleThumbs.indexOf(item);
            if (idx < 0) return;
            currentIndex = idx;
            updateGallery();
        });
    });

    filterButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
            filterButtons.forEach((b) => b.classList.remove('is-active'));
            btn.classList.add('is-active');
            applyFilter(btn.dataset.filter);
        });
    });

    document.addEventListener('DOMContentLoaded', updateGallery);
</script>
